[project]
name = "inss_acidentes"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb", "pyyaml", "pandas", "numpy"]
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]