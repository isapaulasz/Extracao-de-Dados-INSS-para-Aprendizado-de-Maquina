# EDA (Fase 5) — base CAT (uso final: predição + XAI)
# Ajuste os nomes das colunas conforme o dataset PÓS-limpeza/features (cat_limpo.parquet).
# Colunas não listadas são classificadas automaticamente (ver --so-tipos no script).
base: cat
entrada: data/cat/processed/cat_limpo.parquet        # AJUSTAR se o nome for outro

saidas:
  figuras: reports/cat/figures/eda/univariada
  tabelas: reports/cat/tables/eda/univariada

colunas:
  # Listas explícitas sobrescrevem a detecção automática. Deixe [] para tudo automático.
  categoricas: []        # ex.: [sexo, tipo_acidente, indica_obito, uf_acidente, cid10_capitulo]
  numericas: []          # ex.: [idade]
  datas: []              # ex.: [data_acidente, data_emissao_cat]
  # Candidatos a alvo (predição + XAI). Os três últimos são multiclasse; tem_data_despacho é derivado
  # (ver bivariada.indicadores_presenca) e depende de confirmar o que "despacho" significa no dicionário.
  candidatos_alvo:
    - indica_obito_acidente
    - indica_obito
    - indica_afastamento
    - tipo_acidente
    - natureza_lesao_agrup
    - parte_corpo_atingida_agrup
    - tem_data_despacho
  # Fora de toda a EDA: proveniência do arquivo, texto livre e identificadores
  excluir: [arquivo_origem, ano_arquivo, semestre_arquivo, local_acidente, razao_social,
            numero_cat, cnpj_empregador, cnpj_raiz]
  padroes_excluir: ['^id($|_)']   # regex (case-insensitive) de colunas a excluir
  padroes_data: ['^data_']        # convertidas para datetime (aceita ISO, dd/mm/aaaa, aaaammdd)
  padroes_periodo: ['^competencia_']   # inteiros AAAAMM -> datetime (1º dia do mês)

univariada:
  limiar_cat_numerica: 15     # numérica com <= 15 valores distintos é tratada como categórica
  top_n_pareto: 20            # barras individuais no Pareto (resto vira "Outras")
  limiar_pareto: 0.80         # linha de corte do Pareto
  alta_cardinalidade: 50      # acima disso: sinaliza para agrupar (CID/CBO/CNAE, município)
  limiar_dominancia: 0.95     # categoria modal >= 95%: variável quase constante
  limiar_nulos: 0.30          # >= 30% ausentes: sinaliza
  max_linhas_csv: 1000        # linhas gravadas por tabela de frequência
  recortar_percentil: 99.5    # recorte visual dos histogramas (null = sem recorte)

graficos:
  formatos: [png]             # [png, pdf] para versão vetorial no artigo
  dpi: 150

# ---------------------------------------------------------------------------
# Bivariada (qui-quadrado + V de Cramér corrigido)
# ---------------------------------------------------------------------------
bivariada:
  max_niveis: 250             # variável com mais níveis (após agrupar raros) não entra
  min_pct_nivel: 0.0005       # níveis com < 0,05% das linhas válidas viram "Outras"
  limiar_redundancia: 0.90    # V >= 0,90: variável derivada de outra ou possível vazamento
  top_n_alvo: 15
  # Usa-se a versão agrupada (_agrup) de cada hierarquia; as originais e níveis intermediários
  # ficam de fora para a matriz não ser dominada por pares V~1 por construção.
  excluir: [cid_10, cid_categoria, agente_causador, cbo, cnae_empregador, municipio_empresa_cod,
            municipio_segurado_cod, natureza_lesao, parte_corpo_atingida, situacao_geradora,
            tipo_cat_cod, salario_minimo, cbo_subgrupo, cnae_divisao]
  discretizar:                # faixas fixas [a, b); gera <coluna>_faixa
    idade:
      bordas: [18, 30, 40, 50, 60]
      rotulos: ["<18", "18-29", "30-39", "40-49", "50-59", "60+"]
    remuneracao_sm:
      bordas: [1, 2, 3, 5, 10]
      rotulos: ["<1 SM", "1 a <2 SM", "2 a <3 SM", "3 a <5 SM", "5 a <10 SM", ">=10 SM"]
  indicadores_presenca:       # novo_nome: coluna_de_data -> "sim" se a data existe
    tem_data_despacho: data_despacho
    tem_data_afastamento: data_afastamento
    tem_data_obito_segurado: data_obito_segurado
