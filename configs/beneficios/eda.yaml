# EDA (Fase 5) — base BC (Benefícios Concedidos). Uso final: Apriori/FP-Growth + clusterização
# (decisão de 15/11/2026, docs/decisoes_bc_fases1_3.md). NÃO é base de predição.
#
# CORREÇÃO: este arquivo era cópia do configs/cat/eda.yaml (candidatos a alvo, `excluir` e
# `discretizar` do CAT, colunas que não existem no BC). Foi reescrito com as colunas reais do BC.
#
# Entrada: bc_features.parquet (e não bc_limpo.parquet), porque a Fase 4 do BC cria grupo_especie,
# faixa_etaria, regiao, faixa_rmi, faixa_atraso_concessao e faixa_duracao_beneficio, que são as
# variáveis discretas que o Apriori vai usar.
base: beneficios
entrada: data/beneficios/processed/bc_features.parquet

saidas:
  figuras: reports/beneficios/figures/eda/univariada
  tabelas: reports/beneficios/tables/eda/univariada

colunas:
  categoricas: []
  numericas: []
  datas: []
  # Sem desfecho natural no BC. "Candidatos a alvo" aqui são as variáveis que interessam como
  # CONSEQUENTE de regras (Apriori) e como perfil dos clusters. [CONFIRMAR com a autora]
  candidatos_alvo:
    - grupo_especie
    - faixa_rmi
    - faixa_duracao_beneficio
  excluir: [arquivo_origem, ano_arquivo, municipio_residencia_cod]
  padroes_excluir: ['^id($|_)']
  padroes_data: ['^data_']
  padroes_periodo: ['^competencia_']

univariada:
  limiar_cat_numerica: 15
  top_n_pareto: 20
  limiar_pareto: 0.80
  alta_cardinalidade: 50
  limiar_dominancia: 0.95
  limiar_nulos: 0.30
  max_linhas_csv: 1000
  recortar_percentil: 99.5

graficos:
  formatos: [png]
  dpi: 150

# ---------------------------------------------------------------------------
# Bivariada (qui-quadrado + V de Cramér corrigido)
# ---------------------------------------------------------------------------
bivariada:
  max_niveis: 250
  min_pct_nivel: 0.0005
  limiar_redundancia: 0.90
  top_n_alvo: 15
  # Segue a tabela de redundância de docs/decisoes_bc_fase4.md: fica uma versão de cada grupo.
  # Fora da matriz: versões brutas/intermediárias das hierarquias e colunas que repetem outra.
  excluir: [cid_10, cid_categoria, despacho, especie, municipio_residencia_cod,
            ano_dib, mes_dib, tem_data_cessacao, rmi_abaixo_piso]
  # Sem `discretizar`: a Fase 4 já entrega faixa_etaria e faixa_rmi. idade, qt_sm_rmi,
  # atraso_concessao_dias e duracao_beneficio_dias aparecem como "numerica_sem_discretizacao" e
  # ficam para a clusterização (K-Prototypes), que aceita numéricas.
  discretizar: {}
  indicadores_presenca: {}

# ---------------------------------------------------------------------------
# Informação mútua vs candidatos a alvo (+ desbalanceamento)
# ---------------------------------------------------------------------------
mi:
  top_n: 15
  limiar_determinismo: 0.90
  limiar_irrelevante: 0.001
  # alvo da EDA -> chave em configs/beneficios/features.yaml (vazamento). No BC o mapa é só
  # REGISTRO de redundância (decisões da Fase 4): aqui marca o que geraria regra trivial.
  alvos_vazamento:
    grupo_especie: especie
    faixa_rmi: rmi
    faixa_duracao_beneficio: duracao
  recortes: []

# ---------------------------------------------------------------------------
# Séries temporais
# ---------------------------------------------------------------------------
temporal:
  inicio: "2012-01"
  fim: "2018-12"
  # competencia_concessao = mês da DDB em 100% das linhas (auditoria). data_dib é a data de início
  # do benefício e pode ser bem anterior (efeito retroativo): vai aparecer em n_antes_inicio.
  colunas_data: [competencia_concessao, data_dib]
  eixo_categorias: competencia_concessao
  series_categoria: [grupo_especie, faixa_etaria]
  top_n_categorias: 6
  eixo_taxas: competencia_concessao
  taxas_alvo:
    - {coluna: grupo_especie, positiva: PENSAO_POR_MORTE}
    - {coluna: grupo_especie, positiva: AUXILIO_ACIDENTE}
    - {coluna: rmi_abaixo_piso, positiva: true}
    - {coluna: tem_data_cessacao, positiva: true}
  controle_arquivo: arquivo_origem
  suavizacao_meses: 12

# ---------------------------------------------------------------------------
# Ranking por UF / região (UF de residência do beneficiário, não a do acidente)
# ---------------------------------------------------------------------------
territorial:
  coluna_uf: uf
  coluna_regiao: regiao
  min_n_taxa: 200
  taxas_alvo:
    - {coluna: grupo_especie, positiva: PENSAO_POR_MORTE}
    - {coluna: grupo_especie, positiva: AUXILIO_ACIDENTE}
    - {coluna: rmi_abaixo_piso, positiva: true}
